[project]
name = "sigils"
version = "0.1.0"
description = "Solver for the tetromino sigil puzzles in The Talos Principle"
authors = [{ name = "jffordem", email = "jffordem@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy>=2.4.6,<3.0.0",
    "flask>=3.1.3,<4.0.0",
    "textual>=8.2.7,<9.0.0",
    "rich>=15.0.0,<16.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "flake8>=7.3.0,<8.0.0",
]

[tool.uv]
package = false
